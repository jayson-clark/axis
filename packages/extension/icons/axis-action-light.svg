  <title>Axis</title>
  <!-- The Axis mark from assets/axis-mark.svg, recoloured for a light toolbar and
       inset by 2 units a side. Geometry must stay identical to the root mark:
       the padding is in the viewBox, so the mark clears the 16px button edge
