packages:
  - 'packages/*'
  # examples/scripts holds .axis files, not a package; pnpm skips any directory
  # here without a package.json.
  - 'examples/*'
  - 'docs/site'

# All third-party dependency versions are pinned here. Packages reference them
# with "catalog:" instead of a version range.
catalog:
  '@astrojs/markdown-remark': 7.3.1
  '@astrojs/react': 6.0.6
  '@astrojs/starlight': 0.42.2
  '@types/node': 26.4.0
  '@types/react': 19.2.18
  '@types/react-dom': 19.2.5
  '@types/vscode': 1.134.0
  '@vscode/test-electron': 3.1.0
  '@vscode/vsce': 4.0.0
  astro: 7.3.3
  esbuild: 0.28.2
  monaco-editor: 0.56.0
  playwright-core: 1.62.1
  prettier: 3.9.6
  react: 19.2.8
  react-dom: 19.2.8
  typescript: 7.0.2
  unist-util-visit: 5.1.0
  vite: 8.2.2
  '@vitejs/plugin-react': 6.1.0
  vscode-jsonrpc: 9.0.2
  vscode-languageclient: 10.1.1
  vscode-languageserver: 10.1.1
  vscode-languageserver-textdocument: 1.0.14
  vscode-uri: 3.2.0

# pnpm holds brand-new releases back by default; these are the versions pinned
# above that are newer than that window.
minimumReleaseAgeExclude:
  - '@types/node@26.4.0'

# esbuild's postinstall installs its platform-native binary. vsce-sign's
# fetches a signing tool that only publishing to the Marketplace uses, and
# `vsce package` does not.
allowBuilds:
  '@vscode/vsce-sign': false
  esbuild: true
