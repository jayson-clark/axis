# Checks every pull request, and main after each merge.
#
# The same checks the release workflow runs before it publishes - formatting,
# types, and every suite, harness included - so a change that would stop a
# release is caught on its pull request rather than on the tag. The site is
# built too, since site.yml only builds it once a change is already on main.
#
# The ruleset on main requires `test` and `site` to pass, by these job names.

name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a pull request supersedes the run still going for the last.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm --filter @axis-dsl/harness exec playwright-core install --with-deps chromium
      # The harness answers the calculator's requests from ~/.cache/axis-harness
      # (packages/harness/src/cache.ts). Kept between runs, a run needs nothing
      # from desmos.com. The key follows the file that pins the API version,
      # whose number also names the directory inside, so a new calculator
      # starts a fresh cache rather than mixing into the old one.
      - uses: actions/cache@v6
        id: harness-cache
        with:
          path: ~/.cache/axis-harness
          key: axis-harness-${{ hashFiles('packages/desmos/src/desmos.ts') }}
          restore-keys: axis-harness-
      # On a miss, one calculator fills it before the suites start. Otherwise
      # every harness test file - they run in parallel - misses at once and
      # downloads calculator.js for itself. typecheck has built dist/ by now.
      - name: Warm the Desmos asset cache
        if: steps.harness-cache.outputs.cache-hit != 'true'
        run: node packages/harness/dist/cli.js -e 'y = x'
      - run: pnpm test

  site:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --build
      - run: pnpm site:build
